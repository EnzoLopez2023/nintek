<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sortie — Nintek social handoff source (developer-only).

  Deterministic branded composition for a 1200x630 social share card.
  This is NOT a screenshot of the app, NOT a device mockup, and NOT a
  representation of TestFlight or App Store Connect evidence. It is an
  abstract tactical route/network graphic built from vector shapes plus
  Sortie's canonical project-icon vector.

  Render notes:
  - The corner mark reproduces the simple project-authored vector in
    icon.svg, so this source remains self-contained and renders identically
    before and after handoff to the nintek repository.
  - Palette: incumbent dark-navy tactical identity (#020817 / #06142A /
    #0F172A navy, #2563EB / #60A5FA cobalt, #F59E0B / #FBBF24 gold,
    #EF4444 restrained red, steel neutrals), matching icon.svg,
    appicon_1024.png, assets/towers/keep-*.png, and
    tools/gamecenter/generate_achievement_art.py.
  - Copy is verbatim or a truthful subset of existing product copy in
    tools/appstore/app_store_config.json (name, subtitle, promotional
    text) and RELEASE_LEDGER.md / design/campaign_validation_report.md
    (1,500 levels, 15 biomes). No prices, ratings, review claims, user
    counts, download buttons, or public-release claims are depicted.
    "Pre-release" reflects APP_STORE_STATUS.md: not submitted, not
    public.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Sortie — social share card</title>
  <desc>
    Deterministic branded graphic composition for Sortie (com.nintek.sortie).
    No product interface or gameplay screenshot is depicted: this is an
    abstract tactical route/network illustration (nodes, supply lines, and
    schematic keep silhouettes) plus wordmark and factual product copy. Not a
    device mockup, App Store card, availability badge, or TestFlight evidence.
  </desc>

  <defs>
    <clipPath id="card-bounds">
      <rect x="0" y="0" width="1200" height="630" />
    </clipPath>
    <linearGradient id="node-glow-player" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.55" />
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g clip-path="url(#card-bounds)">
    <!-- Base field -->
    <rect x="0" y="0" width="1200" height="630" fill="#020817" />

    <!-- Angular depth sectors, flat fills only (no raster gradients baked in) -->
    <polygon points="0,0 460,0 260,300 0,430" fill="#06142A" opacity="0.55" />
    <polygon points="1200,0 840,0 980,260 1200,360" fill="#0F172A" opacity="0.5" />
    <polygon points="0,630 0,420 300,520 420,630" fill="#0F172A" opacity="0.45" />
    <polygon points="1200,630 1200,400 900,480 760,630" fill="#06142A" opacity="0.5" />

    <!-- Faint tactical grid -->
    <g stroke="#60A5FA" stroke-width="1" opacity="0.08">
      <line x1="-100" y1="0" x2="600" y2="630" />
      <line x1="0" y1="-40" x2="700" y2="630" />
      <line x1="120" y1="-40" x2="820" y2="630" />
      <line x1="260" y1="-40" x2="960" y2="630" />
      <line x1="420" y1="-40" x2="1120" y2="630" />
      <line x1="580" y1="-40" x2="1280" y2="630" />
      <line x1="740" y1="-40" x2="1440" y2="630" />
      <line x1="900" y1="-40" x2="1600" y2="630" />
      <line x1="0" y1="120" x2="1200" y2="30" />
      <line x1="0" y1="300" x2="1200" y2="210" />
      <line x1="0" y1="480" x2="1200" y2="390" />
      <line x1="0" y1="640" x2="1200" y2="560" />
    </g>

    <!-- Safe-margin guide is intentionally not drawn; content below keeps a
         60px margin from every edge. -->

    <!-- ============================= LEFT COLUMN: identity + copy ============================= -->

    <!-- Canonical project-icon vector, reproduced from icon.svg. -->
    <g transform="translate(64,64)">
      <rect x="-10" y="-10" width="76" height="76" rx="20" fill="#0B203B" stroke="#1E4D78" stroke-width="2" />
      <g transform="scale(0.4375)">
        <rect width="128" height="128" rx="24" fill="#0F172A" />
        <line x1="34" y1="94" x2="94" y2="40" stroke="#3B82F6" stroke-width="5"
              stroke-linecap="round" opacity="0.55" />
        <circle cx="34" cy="94" r="15" fill="#3B82F6" />
        <circle cx="94" cy="40" r="15" fill="#EF4444" />
        <circle cx="64" cy="67" r="7" fill="#93C5FD" />
      </g>
      <rect x="0" y="0" width="56" height="56" rx="13" fill="none" stroke="#020817" stroke-width="2" opacity="0.4" />
    </g>

    <!-- Wordmark (vector, not the raster in-game logo, so it stays crisp at
         social-preview sizes) -->
    <g transform="translate(140,100)">
      <text x="0" y="0" font-family="Helvetica Neue, Arial, sans-serif" font-size="64"
            font-weight="700" letter-spacing="4" fill="#F1F5F9">SORTIE</text>
      <rect x="2" y="14" width="238" height="5" fill="#2563EB" />
      <rect x="244" y="14" width="34" height="5" fill="#F59E0B" />
    </g>

    <!-- Subtitle (verbatim: appStoreVersionLocalization subtitle) -->
    <text x="64" y="196" font-family="Helvetica Neue, Arial, sans-serif" font-size="26"
          font-weight="600" letter-spacing="2" fill="#93C5FD">TOWER WAR · TACTICAL CONQUEST</text>

    <!-- Promo line (truthful subset of existing promotionalText clause) -->
    <text x="64" y="256" font-family="Helvetica Neue, Arial, sans-serif" font-size="30"
          font-weight="400" fill="#CBD5E1">Draw permanent supply lines,</text>
    <text x="64" y="296" font-family="Helvetica Neue, Arial, sans-serif" font-size="30"
          font-weight="400" fill="#CBD5E1">outmaneuver rival keeps.</text>

    <!-- Stat line (verified facts: 1,500-level campaign, 15 biomes, iPhone-only) -->
    <g transform="translate(64,356)">
      <text x="0" y="0" font-family="Helvetica Neue, Arial, sans-serif" font-size="24"
            font-weight="600" fill="#FBBF24">1,500 levels</text>
      <text x="150" y="0" font-family="Helvetica Neue, Arial, sans-serif" font-size="24"
            font-weight="400" fill="#475569">·</text>
      <text x="166" y="0" font-family="Helvetica Neue, Arial, sans-serif" font-size="24"
            font-weight="600" fill="#FBBF24">15 biomes</text>
      <text x="290" y="0" font-family="Helvetica Neue, Arial, sans-serif" font-size="24"
            font-weight="400" fill="#475569">·</text>
      <text x="306" y="0" font-family="Helvetica Neue, Arial, sans-serif" font-size="24"
            font-weight="600" fill="#FBBF24">iPhone</text>
    </g>

    <!-- Plain status label (truthful: not submitted, not public). -->
    <g transform="translate(64,392)">
      <rect x="0" y="5" width="28" height="3" fill="#F59E0B" />
      <text x="40" y="12" font-family="Helvetica Neue, Arial, sans-serif" font-size="17"
            font-weight="600" letter-spacing="1.5" fill="#FBBF24">PRE-RELEASE</text>
    </g>

    <!-- Footnote -->
    <text x="64" y="552" font-family="Helvetica Neue, Arial, sans-serif" font-size="18"
          fill="#94A3B8">nintek.com/sortie</text>

    <!-- ============================= RIGHT PANEL: tactical route/network ============================= -->
    <!-- Abstract nodes, a supply-line path, and schematic (non-photographic)
         keep silhouettes. No board, HUD, or UI chrome is depicted. -->
    <g transform="translate(700,0)">
      <!-- Panel depth wash -->
      <rect x="0" y="0" width="440" height="630" fill="#06142A" opacity="0.35" />

      <!-- Supply route: neutral keep -> captured node -> player keep, with a
           contested lane leading toward the enemy keep. -->
      <path d="M 40 470 L 130 400 L 210 430 L 260 340 L 330 300"
            fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"
            stroke-linejoin="round" opacity="0.85" />
      <path d="M 330 300 L 372 210"
            fill="none" stroke="#EF4444" stroke-width="4" stroke-linecap="round"
            stroke-dasharray="2 10" opacity="0.75" />

      <!-- Contested-lane cancel marker (troops in motion cancel on contact) -->
      <g transform="translate(351,255)">
        <line x1="-9" y1="-9" x2="9" y2="9" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
        <line x1="9" y1="-9" x2="-9" y2="9" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
      </g>

      <!-- Waypoint nodes -->
      <circle cx="130" cy="400" r="7" fill="#60A5FA" opacity="0.9" />
      <circle cx="210" cy="430" r="7" fill="#FBBF24" opacity="0.9" />
      <circle cx="260" cy="340" r="6" fill="#60A5FA" opacity="0.75" />

      <!-- Neutral keep (schematic silhouette, start of the route) -->
      <g transform="translate(40,470)">
        <polygon points="0,-30 24,-6 24,26 -24,26 -24,-6" fill="#1F2937" stroke="#475569" stroke-width="2" />
        <polygon points="0,-30 24,-6 -24,-6" fill="#334155" />
        <rect x="-6" y="6" width="12" height="16" fill="#020817" />
      </g>

      <!-- Player keep (captured / advancing, glowing ring) -->
      <g transform="translate(330,300)">
        <circle r="46" fill="url(#node-glow-player)" />
        <polygon points="0,-42 34,-9 34,36 -34,36 -34,-9" fill="#123457" stroke="#2563EB" stroke-width="3" />
        <polygon points="0,-42 34,-9 -34,-9" fill="#1E4D78" />
        <rect x="-9" y="8" width="18" height="22" fill="#020817" />
        <rect x="-4" y="-2" width="8" height="9" fill="#60A5FA" />
      </g>

      <!-- Enemy keep (contested, far edge) -->
      <g transform="translate(388,180)">
        <polygon points="0,-26 21,-5 21,22 -21,22 -21,-5" fill="#3F1D2B" stroke="#7F1D1D" stroke-width="2" />
        <polygon points="0,-26 21,-5 -21,-5" fill="#5B2233" />
        <rect x="-5" y="4" width="10" height="14" fill="#020817" />
      </g>

      <!-- Distant unclaimed nodes, implying the wider 15-biome campaign map -->
      <circle cx="60" cy="120" r="4" fill="#475569" opacity="0.6" />
      <circle cx="150" cy="90" r="4" fill="#475569" opacity="0.6" />
      <circle cx="230" cy="140" r="4" fill="#475569" opacity="0.5" />
      <circle cx="90" cy="560" r="4" fill="#475569" opacity="0.5" />
      <circle cx="180" cy="580" r="4" fill="#475569" opacity="0.4" />
    </g>
  </g>
</svg>
