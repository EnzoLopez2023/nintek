<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Tare social preview</title>
  <desc id="desc">A deterministic branded composition using Tare's canonical capsule icon, enamel ground, engraved graphite, calibration marks, and vermilion index color. No product interface is depicted.</desc>
  <defs>
    <linearGradient id="tare-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/>
      <stop offset="0.58" stop-color="#eef3f5"/>
      <stop offset="1" stop-color="#e4edf1"/>
    </linearGradient>
    <linearGradient id="tare-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f16b45"/>
      <stop offset="1" stop-color="#e23d28"/>
    </linearGradient>
    <radialGradient id="tare-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#cedbf2" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#cedbf2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tare-grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#bacbd4" stroke-width="1" stroke-opacity="0.42"/>
    </pattern>
    <pattern id="tare-major-grid" width="256" height="256" patternUnits="userSpaceOnUse">
      <path d="M256 0H0V256" fill="none" stroke="#9caeb9" stroke-width="1" stroke-opacity="0.24"/>
    </pattern>
    <filter id="tare-soft-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#222c33" flood-opacity="0.16"/>
    </filter>
    <filter id="tare-icon-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#222c33" flood-opacity="0.18"/>
    </filter>
    <clipPath id="tare-icon-clip">
      <rect x="72" y="104" width="116" height="116" rx="27"/>
    </clipPath>
    <clipPath id="tare-capsule-clip">
      <rect x="73" y="150" width="418" height="196" rx="98"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#tare-bg)"/>
  <rect width="1200" height="630" fill="url(#tare-grid)"/>
  <rect width="1200" height="630" fill="url(#tare-major-grid)"/>
  <ellipse cx="924" cy="310" rx="360" ry="330" fill="url(#tare-glow)"/>

  <g aria-hidden="true">
    <path d="M42 42h36M42 42v36M1158 42h-36M1158 42v36M42 588h36M42 588v-36M1158 588h-36M1158 588v-36"
      fill="none" stroke="#9caeb9" stroke-width="2"/>
    <line x1="62" y1="72" x2="552" y2="72" stroke="#bacbd4" stroke-width="1"/>
    <line x1="62" y1="72" x2="62" y2="86" stroke="#9caeb9" stroke-width="1"/>
    <line x1="552" y1="72" x2="552" y2="86" stroke="#9caeb9" stroke-width="1"/>
  </g>

  <g>
    <text x="72" y="66" fill="#5e6e79" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3.8">NINTEK / TARE</text>
    <rect x="72" y="104" width="116" height="116" rx="27" fill="#ffffff" stroke="#bacbd4" stroke-width="2" filter="url(#tare-icon-shadow)"/>
    <image href="../../apps/tare.png" x="72" y="104" width="116" height="116" preserveAspectRatio="xMidYMid slice" clip-path="url(#tare-icon-clip)"/>
    <text x="214" y="198" fill="#222c33" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="-4">Tare</text>

    <text x="72" y="315" fill="#222c33" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" letter-spacing="-2">
      <tspan x="72" dy="0">Track your week.</tspan>
      <tspan x="72" dy="58" fill="#c42d1a">Reset to baseline.</tspan>
    </text>

    <text x="74" y="441" fill="#465661" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" letter-spacing="-0.2">
      A calm native health companion.
    </text>

    <g transform="translate(72 491)">
      <rect width="490" height="55" rx="27.5" fill="#ffffff" fill-opacity="0.82" stroke="#bacbd4"/>
      <circle cx="28" cy="27.5" r="6" fill="#e23d28"/>
      <text x="47" y="34" fill="#465661" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.3">IPHONE · IPAD · APPLE WATCH</text>
    </g>
  </g>

  <g transform="translate(650 72)" aria-hidden="true">
    <circle cx="282" cy="238" r="228" fill="#ffffff" fill-opacity="0.5" stroke="#bacbd4" stroke-width="1"/>
    <circle cx="282" cy="238" r="182" fill="none" stroke="#bacbd4" stroke-width="1" stroke-dasharray="3 12"/>
    <circle cx="282" cy="238" r="208" fill="none" stroke="#e23d28" stroke-width="7" stroke-linecap="round" stroke-dasharray="108 1199" transform="rotate(-54 282 238)"/>
    <line x1="34" y1="460" x2="532" y2="460" stroke="#9caeb9" stroke-width="2"/>
    <g stroke="#9caeb9" stroke-width="1">
      <line x1="34" y1="452" x2="34" y2="468"/>
      <line x1="84" y1="455" x2="84" y2="465"/>
      <line x1="134" y1="455" x2="134" y2="465"/>
      <line x1="184" y1="455" x2="184" y2="465"/>
      <line x1="234" y1="452" x2="234" y2="468"/>
      <line x1="284" y1="455" x2="284" y2="465"/>
      <line x1="334" y1="455" x2="334" y2="465"/>
      <line x1="384" y1="455" x2="384" y2="465"/>
      <line x1="434" y1="452" x2="434" y2="468"/>
      <line x1="484" y1="455" x2="484" y2="465"/>
      <line x1="532" y1="452" x2="532" y2="468"/>
    </g>

    <g filter="url(#tare-soft-shadow)">
      <rect x="73" y="150" width="418" height="196" rx="98" fill="#ffffff" stroke="#9caeb9" stroke-width="3"/>
      <rect x="282" y="150" width="209" height="196" fill="url(#tare-red)" clip-path="url(#tare-capsule-clip)"/>
      <rect x="276" y="188" width="13" height="120" rx="2" fill="#222c33"/>
      <ellipse cx="163" cy="197" rx="55" ry="16" fill="#ffffff" opacity="0.78"/>
      <ellipse cx="383" cy="197" rx="55" ry="16" fill="#ffffff" opacity="0.18"/>
    </g>

    <g fill="none" stroke="#788994" stroke-width="1.5">
      <path d="M111 386h342"/>
      <path d="M111 378v16M168 381v10M225 381v10M282 378v16M339 381v10M396 381v10M453 378v16"/>
      <path d="M84 118h94M84 112v12M178 112v12"/>
    </g>
    <text x="96" y="107" fill="#5e6e79" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">WEEK / 01</text>
    <text x="191" y="411" fill="#5e6e79" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">RETURN TO BASELINE</text>
  </g>

  <rect x="0" y="611" width="1200" height="19" fill="#222c33"/>
  <rect x="0" y="611" width="216" height="19" fill="#e23d28"/>
</svg>
