<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Cortex social preview</title>
  <desc id="desc">A deterministic graphic composition using Cortex's canonical icon, electric violet, teal neural nodes, and an ink-blue field. No product interface is depicted.</desc>
  <defs>
    <linearGradient id="cx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b1d"/>
      <stop offset="0.6" stop-color="#121027"/>
      <stop offset="1" stop-color="#1a142e"/>
    </linearGradient>
    <radialGradient id="cx-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7d5cf5" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7d5cf5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cx-teal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38cccc" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38cccc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cx-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.035"/>
    </pattern>
    <filter id="cx-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#02030a" flood-opacity="0.6"/>
    </filter>
    <clipPath id="cx-icon-clip">
      <rect x="754" y="118" width="330" height="330" rx="72"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#cx-bg)"/>
  <rect width="1200" height="630" fill="url(#cx-grid)"/>
  <ellipse cx="890" cy="240" rx="420" ry="360" fill="url(#cx-violet)"/>
  <ellipse cx="1090" cy="510" rx="340" ry="270" fill="url(#cx-teal)"/>

  <g fill="none" stroke-linecap="round" aria-hidden="true">
    <path d="M678 138 742 191 698 278 760 354 708 448 786 515" stroke="#7d5cf5" stroke-width="2" stroke-opacity="0.52"/>
    <path d="M1080 104 1118 181 1068 264 1132 337 1084 431 1130 510" stroke="#38cccc" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M704 278 858 176 1068 264M760 354 908 486 1084 431" stroke="#ffffff" stroke-width="1" stroke-opacity="0.16"/>
  </g>
  <g aria-hidden="true">
    <circle cx="678" cy="138" r="8" fill="#38cccc"/>
    <circle cx="698" cy="278" r="6" fill="#7d5cf5"/>
    <circle cx="708" cy="448" r="8" fill="#38cccc"/>
    <circle cx="1080" cy="104" r="6" fill="#7d5cf5"/>
    <circle cx="1068" cy="264" r="8" fill="#38cccc"/>
    <circle cx="1084" cy="431" r="6" fill="#7d5cf5"/>
    <circle cx="786" cy="515" r="5" fill="#ffffff" fill-opacity="0.8"/>
    <circle cx="1130" cy="510" r="5" fill="#ffffff" fill-opacity="0.8"/>
  </g>

  <g>
    <text x="68" y="70" fill="#9fa6c7" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3.7">NINTEK / CORTEX</text>
    <text x="68" y="190" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800" letter-spacing="-4">Cortex</text>
    <text x="68" y="302" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="51" font-weight="800" letter-spacing="-2.3">Eight games.</text>
    <text x="68" y="362" fill="#38cccc" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="800" letter-spacing="-2.1">One vivid little universe.</text>
    <text x="70" y="430" fill="#bdc5e4" font-family="Arial, Helvetica, sans-serif" font-size="21">Native play, with no Nintek account or backend.</text>
    <g transform="translate(68 486)">
      <rect width="420" height="54" rx="27" fill="#ffffff" fill-opacity="0.07" stroke="#7d5cf5" stroke-opacity="0.7"/>
      <circle cx="28" cy="27" r="6" fill="#38cccc"/>
      <text x="48" y="33" fill="#d6d9ec" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">INTERNAL TESTFLIGHT / NOT PUBLIC</text>
    </g>
  </g>

  <g filter="url(#cx-shadow)" aria-hidden="true">
    <rect x="730" y="94" width="378" height="378" rx="88" fill="#060815" stroke="#7d5cf5" stroke-width="2" stroke-opacity="0.75"/>
    <image href="../../apps/cortex.png" x="754" y="118" width="330" height="330" preserveAspectRatio="xMidYMid slice" clip-path="url(#cx-icon-clip)"/>
  </g>

  <rect y="611" width="1200" height="19" fill="#050713"/>
  <rect y="611" width="210" height="19" fill="#7d5cf5"/>
  <rect x="210" y="611" width="84" height="19" fill="#38cccc"/>
</svg>
