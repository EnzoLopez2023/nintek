<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Workshop social preview</title>
  <desc id="desc">A deterministic Living Plan Table composition using Workshop's canonical icon, cool vellum, spruce structure, pencil-blue drafting marks, amber next-action color, and the approved real web capture.</desc>
  <defs>
    <linearGradient id="wk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfa"/>
      <stop offset="0.52" stop-color="#eef4f2"/>
      <stop offset="1" stop-color="#e0ebe7"/>
    </linearGradient>
    <pattern id="wk-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#356d85" stroke-width="1" stroke-opacity="0.095"/>
    </pattern>
    <pattern id="wk-major-grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#356d85" stroke-width="1" stroke-opacity="0.13"/>
    </pattern>
    <filter id="wk-sheet-shadow" x="-20%" y="-20%" width="150%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#15332e" flood-opacity="0.18"/>
    </filter>
    <filter id="wk-icon-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#15332e" flood-opacity="0.18"/>
    </filter>
    <clipPath id="wk-icon-clip">
      <rect x="67" y="104" width="96" height="96" rx="22"/>
    </clipPath>
    <clipPath id="wk-capture-clip">
      <rect x="0" y="0" width="500" height="418" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#wk-bg)"/>
  <rect width="1200" height="630" fill="url(#wk-grid)"/>
  <rect width="1200" height="630" fill="url(#wk-major-grid)"/>
  <rect x="0" y="0" width="18" height="630" fill="#15332e"/>
  <rect x="18" y="0" width="6" height="630" fill="#d99724"/>

  <g aria-hidden="true" fill="none" stroke="#356d85">
    <path d="M47 47h34M47 47v34M1153 47h-34M1153 47v34M47 583h34M47 583v-34M1153 583h-34M1153 583v-34" stroke-width="2"/>
    <line x1="66" y1="72" x2="548" y2="72" stroke-width="1"/>
    <line x1="66" y1="65" x2="66" y2="79" stroke-width="1"/>
    <line x1="548" y1="65" x2="548" y2="79" stroke-width="1"/>
  </g>

  <g>
    <text x="67" y="66" fill="#356d85" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3.5">NINTEK / WORKSHOP</text>
    <rect x="67" y="104" width="96" height="96" rx="22" fill="#fafcfb" stroke="#afc7c0" stroke-width="2" filter="url(#wk-icon-shadow)"/>
    <image href="../../apps/workshop.png" x="67" y="104" width="96" height="96" preserveAspectRatio="xMidYMid slice" clip-path="url(#wk-icon-clip)"/>
    <text x="186" y="176" fill="#15332e" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-size="61" font-weight="700" letter-spacing="-3">Workshop</text>

    <text x="67" y="292" fill="#15332e" font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif" font-size="49" font-weight="700" letter-spacing="-2.2">
      <tspan x="67" dy="0">Keep the whole</tspan>
      <tspan x="67" dy="55">build connected.</tspan>
    </text>

    <text x="69" y="432" fill="#58716b" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">
      Plans, cuts, materials, and build records.
    </text>

    <g transform="translate(67 485)">
      <rect width="433" height="54" rx="14" fill="#fafcfb" stroke="#afc7c0"/>
      <rect width="12" height="54" rx="6" fill="#125447"/>
      <text x="34" y="33" fill="#15332e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.15">ONLINE, ACCOUNT-BACKED WEB WORKSPACE</text>
    </g>
  </g>

  <g transform="translate(663 96) rotate(-2 250 209)">
    <rect x="-30" y="-22" width="500" height="418" rx="12" fill="#d9e7e3" fill-opacity="0.78" stroke="#afc7c0"/>
    <rect x="20" y="-8" width="500" height="418" rx="12" fill="#fafcfb" fill-opacity="0.72" stroke="#7ba89c"/>
    <g filter="url(#wk-sheet-shadow)">
      <rect width="500" height="418" rx="24" fill="#fafcfb"/>
      <image href="../../apps/workshop/web-project.webp" x="0" y="0" width="500" height="418" preserveAspectRatio="xMidYMid meet" clip-path="url(#wk-capture-clip)"/>
      <rect width="500" height="418" rx="24" fill="none" stroke="#c9dad5" stroke-width="2"/>
    </g>

    <g fill="none" stroke="#356d85" stroke-width="1.5" aria-hidden="true">
      <path d="M-13 12H3M-13 12V28M497 406h16M513 390v16"/>
      <line x1="12" y1="-38" x2="488" y2="-38"/>
      <line x1="12" y1="-46" x2="12" y2="-30"/>
      <line x1="488" y1="-46" x2="488" y2="-30"/>
    </g>
    <text x="202" y="-47" fill="#29566a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">LIVE WEB FIELD</text>
  </g>

  <g transform="translate(696 548)">
    <line x1="0" y1="0" x2="429" y2="0" stroke="#afc7c0"/>
    <circle cx="0" cy="0" r="5" fill="#d99724"/>
    <text x="17" y="6" fill="#356d85" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2.2">REAL WEB CAPTURE / CURRENT WORKSPACE</text>
  </g>

  <rect x="24" y="611" width="1176" height="19" fill="#15332e"/>
  <rect x="24" y="611" width="218" height="19" fill="#d99724"/>
</svg>
