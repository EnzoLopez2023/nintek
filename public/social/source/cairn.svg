<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Cairn social preview</title>
  <desc id="desc">A deterministic graphic composition using Cairn's canonical icon and product motifs: cool drafting paper, plotted cobalt rules, a flat certification cairn, and one vermilion capstone. No product interface is depicted.</desc>
  <defs>
    <linearGradient id="cairn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfe"/>
      <stop offset="0.62" stop-color="#edf2f8"/>
      <stop offset="1" stop-color="#e3ebf5"/>
    </linearGradient>
    <linearGradient id="cairn-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e86ee"/>
      <stop offset="1" stop-color="#1b5fd9"/>
    </linearGradient>
    <pattern id="cairn-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1b5fd9" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
    <pattern id="cairn-major-grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#1b5fd9" stroke-width="1" stroke-opacity="0.12"/>
    </pattern>
    <filter id="cairn-icon-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a2540" flood-opacity="0.14"/>
    </filter>
    <clipPath id="cairn-icon-clip">
      <rect x="69" y="104" width="102" height="102" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#cairn-bg)"/>
  <rect width="1200" height="630" fill="url(#cairn-grid)"/>
  <rect width="1200" height="630" fill="url(#cairn-major-grid)"/>

  <g aria-hidden="true">
    <path d="M43 43h34M43 43v34M1157 43h-34M1157 43v34M43 587h34M43 587v-34M1157 587h-34M1157 587v-34"
      fill="none" stroke="#b6c8de" stroke-width="2"/>
    <line x1="62" y1="72" x2="554" y2="72" stroke="#b6c8de"/>
    <line x1="62" y1="64" x2="62" y2="80" stroke="#b6c8de"/>
    <line x1="554" y1="64" x2="554" y2="80" stroke="#b6c8de"/>
  </g>

  <g>
    <text x="69" y="66" fill="#546d8b" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="3.2">NINTEK / CAIRN</text>
    <rect x="69" y="104" width="102" height="102" rx="16" fill="#ffffff" stroke="#b6c8de" stroke-width="2" filter="url(#cairn-icon-shadow)"/>
    <image href="../../apps/cairn.png" x="69" y="104" width="102" height="102" preserveAspectRatio="xMidYMid slice" clip-path="url(#cairn-icon-clip)"/>
    <text x="196" y="181" fill="#0a2540" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="-3.5">Cairn</text>

    <text x="69" y="315" fill="#0a2540" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="800" letter-spacing="-2.2">
      <tspan x="69" dy="0">Place every stone.</tspan>
      <tspan x="69" dy="57" fill="#1b5fd9">Reach the summit.</tspan>
    </text>

    <text x="71" y="443" fill="#28405c" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">
      Microsoft certification study companion.
    </text>

    <g transform="translate(69 491)">
      <line x1="0" y1="0" x2="478" y2="0" stroke="#b6c8de"/>
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#b6c8de"/>
      <line x1="478" y1="-7" x2="478" y2="7" stroke="#b6c8de"/>
      <text x="0" y="32" fill="#546d8b" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2.1">STUDY · PRACTICE · PROGRESS</text>
    </g>
  </g>

  <g transform="translate(651 66)" aria-hidden="true">
    <rect x="18" y="20" width="500" height="476" rx="14" fill="#ffffff" fill-opacity="0.54" stroke="#b6c8de"/>
    <path d="M38 40h32M38 40v32M498 40h-32M498 40v32M38 476h32M38 476v-32M498 476h-32M498 476v-32"
      fill="none" stroke="#1b5fd9" stroke-width="2" stroke-opacity="0.52"/>
    <line x1="70" y1="428" x2="466" y2="428" stroke="#b6c8de" stroke-width="2"/>
    <g stroke="#b6c8de">
      <line x1="70" y1="420" x2="70" y2="436"/>
      <line x1="136" y1="423" x2="136" y2="433"/>
      <line x1="202" y1="423" x2="202" y2="433"/>
      <line x1="268" y1="420" x2="268" y2="436"/>
      <line x1="334" y1="423" x2="334" y2="433"/>
      <line x1="400" y1="423" x2="400" y2="433"/>
      <line x1="466" y1="420" x2="466" y2="436"/>
    </g>

    <g font-family="Menlo, Consolas, monospace" font-weight="700" text-anchor="middle" fill="#ffffff">
      <ellipse cx="268" cy="378" rx="198" ry="47" fill="#1450bd"/>
      <text x="268" y="384" font-size="16" letter-spacing="2.4">AZ-104</text>

      <ellipse cx="268" cy="295" rx="160" ry="40" fill="#1a5cd3"/>
      <text x="268" y="301" font-size="15" letter-spacing="2.2">SC-900</text>

      <ellipse cx="268" cy="223" rx="126" ry="34" fill="#2568e0"/>
      <text x="268" y="229" font-size="14" letter-spacing="2">DP-700</text>

      <ellipse cx="268" cy="160" rx="93" ry="29" fill="#3d7dec"/>
      <text x="268" y="166" font-size="13" letter-spacing="1.8">AZ-400</text>

      <ellipse cx="268" cy="104" rx="62" ry="25" fill="#e4572e"/>
      <text x="268" y="110" font-size="12" letter-spacing="1.5">AI-901</text>
    </g>

    <g transform="translate(108 461)">
      <circle cx="0" cy="0" r="5" fill="#e4572e"/>
      <text x="15" y="5" fill="#123f94" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">CERTIFICATION TRAIL / 05</text>
    </g>
  </g>

  <g transform="translate(0 558)">
    <rect width="1200" height="53" fill="#ffffff" fill-opacity="0.72"/>
    <line y1="0" x2="1200" y2="0" stroke="#b6c8de"/>
    <text x="71" y="32" fill="#546d8b" font-family="Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.4">
      AZ-104 · AZ-305 · AI-102 · DP-700 · SC-900 · GH-300 · PL-400 · MS-102
    </text>
  </g>

  <rect x="0" y="611" width="1200" height="19" fill="#0a2540"/>
  <rect x="0" y="611" width="210" height="19" fill="#1b5fd9"/>
  <rect x="210" y="611" width="48" height="19" fill="#e4572e"/>
</svg>
