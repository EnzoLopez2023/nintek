<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- App icon: warm cream background + N dot-grid mark -->
  <rect width="64" height="64" rx="14" fill="#FAF5EE"/>
  <!-- Grid scaled to 48×48 centered in 64×64 canvas (offset 8,8)
       Original 100×100 viewBox → scale 0.48, translate 8 8
       Circle centers: 19→9.12+8=17.12, 50→24+8=32, 81→38.88+8=46.88 → rounded
       Radius: 12 × 0.48 = 5.76 → 5.8 -->
  <!-- Row 1 -->
  <circle cx="17" cy="17" r="5.8" fill="#C17A2E"/>
  <circle cx="32" cy="17" r="5.8" fill="#9c8476"/>
  <circle cx="47" cy="17" r="5.8" fill="#C17A2E"/>
  <!-- Row 2 -->
  <circle cx="17" cy="32" r="5.8" fill="#C17A2E"/>
  <circle cx="32" cy="32" r="5.8" fill="#C17A2E"/>
  <circle cx="47" cy="32" r="5.8" fill="#C17A2E"/>
  <!-- Row 3 -->
  <circle cx="17" cy="47" r="5.8" fill="#C17A2E"/>
  <circle cx="32" cy="47" r="5.8" fill="#9c8476"/>
  <circle cx="47" cy="47" r="5.8" fill="#C17A2E"/>
</svg>
